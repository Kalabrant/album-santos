<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Santos · Administrador</title>
  <meta name="theme-color" content="#1d1630">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css?v=25">
  <style>
    body { background: var(--bg); }
    .adm { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }
    .adm h1 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 4px 0 2px; }
    .adm .sub { color: var(--ink-2); margin: 0 0 14px; font-size: 14.5px; }
    .adm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .adm-c { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; text-align: center; padding-bottom: 6px; }
    .adm-c img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #ddd; }
    .adm-c b { display: block; font-size: 12px; margin-top: 4px; }
    .adm-c span { display: block; font-size: 11.5px; line-height: 1.2; padding: 0 5px; color: var(--ink-2); }
    .adm-c.esp { outline: 2px solid #f2a93b; }
    .adm .search { margin-bottom: 12px; }
    .adm .search input { font-size: 16px; } /* menos de 16px hace que el iPhone amplíe la página */
    .locked { text-align: center; padding: 60px 20px; color: var(--ink-2); }
    #panel { position: fixed; inset: 0; background: rgba(13,9,28,.86); display: none; align-items: flex-end; justify-content: center; z-index: 60; }
    #panel.open { display: flex; }
    #panel .install-sheet { max-height: 94vh; overflow-y: auto; }
    .log { font-size: 13px; color: var(--ink-2); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="adm" id="adm"></div>
  <div id="panel"><div class="install-sheet"><div id="pBody"></div><button class="btn btn-ghost btn-block" id="pClose">Cerrar</button></div></div>
  <div class="toast" id="toast"></div>
  <script src="data/santos.js?v=25"></script>
  <script src="data/imagenes.js?v=25"></script>
  <script src="js/vendor/qrcode.js?v=25"></script>
  <script src="js/admin.js?v=25"></script>
</body>
</html>
